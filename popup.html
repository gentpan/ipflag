<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <span id="coords" hidden></span>
    <div id="loading" class="loading">
      <div class="spinner"></div>
    </div>

    <div id="error" class="state-msg" style="display:none">
      <div id="error-msg" class="error-text"></div>
      <button id="error-retry" class="error-retry" data-i18n="retry">Retry</button>
    </div>

    <div id="content" style="display:none">
      <div class="header">
        <img id="flag-img" class="flag" src="icons/icon48.png" alt="">
        <div class="header-info">
          <div class="country-row">
            <div id="country" class="country-name"></div>
            <div id="country-code" class="country-code"></div>
          </div>
          <div id="city-region" class="city-text"></div>
        </div>
        <div class="header-actions">
          <a id="promo-link" class="header-icon-link" href="https://cleanip.io" target="_blank" rel="noopener noreferrer" data-i18n-title="checkIpReputation">
            <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </a>
          <a class="header-icon-link" href="https://flagcdn.io" target="_blank" rel="noopener noreferrer" data-i18n-title="flagSource">
            <svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          </a>
        </div>
      </div>

      <div id="map-container" class="map-wrap" style="display:none">
        <div id="map-grid" class="map-grid"></div>
        <div id="map-pin" class="map-pin"></div>
        <div id="map-loading" class="map-loading">
          <div class="spinner"></div>
        </div>
      </div>
      <div id="map-context-menu" class="map-context-menu" hidden>
        <button id="map-open" type="button" data-i18n="openInMaps">Open in Maps</button>
      </div>

      <div class="info-list">
        <div class="icon-col">
          <span class="icon-cell"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10A15.3 15.3 0 0 1 12 2"/></svg></span>
          <span class="icon-cell"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
          <span class="icon-cell"><svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></span>
          <span class="icon-cell"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
          <span class="icon-cell"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
          <span class="icon-cell"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
        </div>
        <div class="label-col">
          <span class="label-cell">IP</span>
          <span class="label-cell" data-i18n="domain">Domain</span>
          <span class="label-cell">ASN</span>
          <span class="label-cell">ISP</span>
          <span class="label-cell" data-i18n="timezone">Time zone</span>
          <span class="label-cell">SSL</span>
        </div>
        <div class="val-col">
          <div class="value-row">
            <a id="ip" class="value-main link-value" href="#" target="_blank" rel="noopener noreferrer"></a>
            <span id="ip-source" class="source-badge"></span>
            <button class="copy-btn" type="button" data-copy-target="ip" data-i18n-title="copy">
              <svg viewBox="0 0 24 24"><rect x="9" y="9" width="10" height="10" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
          <div class="value-row">
            <a id="domain" class="value-main domain link-value" href="#" target="_blank" rel="noopener noreferrer"></a>
            <button class="copy-btn" type="button" data-copy-target="domain" data-i18n-title="copy">
              <svg viewBox="0 0 24 24"><rect x="9" y="9" width="10" height="10" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
          <div class="value-row">
            <a id="asn" class="value-main link-value" href="#" target="_blank" rel="noopener noreferrer"></a>
            <button class="copy-btn" type="button" data-copy-target="asn" data-i18n-title="copy">
              <svg viewBox="0 0 24 24"><rect x="9" y="9" width="10" height="10" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
          <span id="isp" class="value-row plain-value"></span>
          <span id="timezone" class="value-row plain-value"></span>
          <div class="value-row ssl-row">
            <button id="ssl-toggle" class="value-main ssl-value" type="button" aria-expanded="false"></button>
            <button class="copy-btn" type="button" data-copy-target="ssl" data-i18n-title="copy">
              <svg viewBox="0 0 24 24"><rect x="9" y="9" width="10" height="10" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div id="ssl-details" class="ssl-details" hidden>
        <div><span data-i18n="sslIssuer">Issuer</span><strong id="ssl-issuer">--</strong></div>
        <div><span data-i18n="sslValidTo">Valid to</span><strong id="ssl-valid-to">--</strong></div>
        <div><span data-i18n="sslHost">Host</span><strong id="ssl-host">--</strong></div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
